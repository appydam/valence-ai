<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Analytics - RacknSell</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { font-size: 28px; margin-bottom: 4px; color: #f8fafc; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    .grid { display: grid; gap: 20px; margin-bottom: 24px; }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    .card h3 { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat { font-size: 36px; font-weight: 700; color: #f8fafc; }
    .stat-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
    .stat-green { color: #4ade80; }
    .stat-blue { color: #60a5fa; }
    .stat-yellow { color: #fbbf24; }
    .stat-purple { color: #a78bfa; }
    .chart-card { min-height: 300px; }
    .chart-card canvas { max-height: 280px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 500; }
    td { padding: 10px 12px; border-bottom: 1px solid #1e293b; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-quoted { background: #1e3a5f; color: #60a5fa; }
    .badge-confirmed { background: #14532d; color: #4ade80; }
    .badge-pending { background: #422006; color: #fbbf24; }
    .badge-greeting { background: #312e81; color: #a78bfa; }
    .badge-error { background: #450a0a; color: #f87171; }
    .badge-other { background: #1e293b; color: #94a3b8; }
    .refresh-btn { position: fixed; bottom: 24px; right: 24px; background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .refresh-btn:hover { background: #2563eb; }
    .loading { text-align: center; padding: 60px; color: #64748b; }
  </style>
</head>
<body>
  <h1>Mercado Analytics</h1>
  <p class="subtitle">RacknSell B2B Sales Agent Dashboard</p>

  <div id="app">
    <div class="loading">Loading analytics data...</div>
  </div>

  <button class="refresh-btn" onclick="loadData()">Refresh</button>

  <script>
    let charts = {};

    function badgeClass(outcome) {
      const map = { quoted: 'badge-quoted', order_confirmed: 'badge-confirmed', pricing_pending: 'badge-pending', greeting: 'badge-greeting', error: 'badge-error', complaint: 'badge-error' };
      return map[outcome] || 'badge-other';
    }

    function formatINR(n) {
      if (n >= 100000) return '\u20B9' + (n / 100000).toFixed(1) + 'L';
      if (n >= 1000) return '\u20B9' + (n / 1000).toFixed(1) + 'K';
      return '\u20B9' + n;
    }

    function render(data) {
      const s = data.summary;
      const app = document.getElementById('app');

      app.innerHTML = `
        <div class="grid grid-4">
          <div class="card">
            <h3>Total Inquiries</h3>
            <div class="stat">${s.totalInquiries}</div>
            <div class="stat-sub">${s.last7DaysInquiries} in last 7 days (${s.avgDailyInquiries}/day)</div>
          </div>
          <div class="card">
            <h3>Quotations Sent</h3>
            <div class="stat stat-blue">${s.totalQuoted}</div>
            <div class="stat-sub">${s.totalInquiries > 0 ? Math.round(s.totalQuoted / s.totalInquiries * 100) : 0}% of inquiries</div>
          </div>
          <div class="card">
            <h3>Orders Confirmed</h3>
            <div class="stat stat-green">${s.totalConfirmed}</div>
            <div class="stat-sub">${s.conversionRate}% conversion rate</div>
          </div>
          <div class="card">
            <h3>Revenue</h3>
            <div class="stat stat-yellow">${formatINR(s.totalRevenue)}</div>
            <div class="stat-sub">From confirmed orders</div>
          </div>
        </div>

        <div class="grid grid-4">
          <div class="card">
            <h3>Unique Customers</h3>
            <div class="stat stat-purple">${s.uniqueCustomers}</div>
            <div class="stat-sub">${s.repeatCustomers} repeat (${s.repeatRate}%)</div>
          </div>
          <div class="card">
            <h3>Pricing Pending</h3>
            <div class="stat stat-yellow">${data.conversionFunnel.pricingPending}</div>
            <div class="stat-sub">Awaiting price confirmation</div>
          </div>
          <div class="card">
            <h3>Not Found</h3>
            <div class="stat" style="color:#f87171">${data.conversionFunnel.notFound}</div>
            <div class="stat-sub">Products not in catalog</div>
          </div>
          <div class="card">
            <h3>Channel Split</h3>
            <div class="stat">${data.channelSplit['WhatsApp'] || 0} / ${data.channelSplit['Email'] || 0}</div>
            <div class="stat-sub">WhatsApp / Email</div>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card chart-card">
            <h3>Daily Volume (Last 30 Days)</h3>
            <canvas id="dailyChart"></canvas>
          </div>
          <div class="card chart-card">
            <h3>Outcome Breakdown</h3>
            <canvas id="outcomeChart"></canvas>
          </div>
        </div>

        <div class="grid grid-3">
          <div class="card chart-card">
            <h3>Hourly Distribution</h3>
            <canvas id="hourlyChart"></canvas>
          </div>
          <div class="card chart-card">
            <h3>Conversion Funnel</h3>
            <canvas id="funnelChart"></canvas>
          </div>
          <div class="card">
            <h3>Top Products (by qty requested)</h3>
            <table>
              <thead><tr><th>SKU</th><th>Qty</th></tr></thead>
              <tbody>
                ${Object.entries(data.topProducts).map(([sku, qty]) =>
                  `<tr><td>${sku}</td><td>${qty}</td></tr>`
                ).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <h3>Top Customers</h3>
            <table>
              <thead><tr><th>Customer</th><th>Inquiries</th></tr></thead>
              <tbody>
                ${Object.entries(data.topCustomers).map(([name, count]) =>
                  `<tr><td>${name}</td><td>${count}</td></tr>`
                ).join('')}
              </tbody>
            </table>
          </div>
          <div class="card">
            <h3>Recent Activity</h3>
            <table>
              <thead><tr><th>Time</th><th>Customer</th><th>Summary</th><th>Outcome</th></tr></thead>
              <tbody>
                ${data.recentActivity.map(r =>
                  `<tr>
                    <td style="white-space:nowrap">${r.timestamp}</td>
                    <td>${r.customer || r.contact}</td>
                    <td>${r.summary.substring(0, 40)}${r.summary.length > 40 ? '...' : ''}</td>
                    <td><span class="badge ${badgeClass(r.outcome)}">${r.outcome}</span></td>
                  </tr>`
                ).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card" style="margin-top:20px;text-align:center;color:#64748b;font-size:12px;">
          Last updated: ${new Date(data.generatedAt).toLocaleString()}
        </div>
      `;

      renderCharts(data);
    }

    function renderCharts(data) {
      // Destroy existing charts
      Object.values(charts).forEach(c => c.destroy());
      charts = {};

      const chartDefaults = {
        color: '#94a3b8',
        borderColor: '#334155',
      };

      // Daily Volume
      const dailyLabels = Object.keys(data.dailyVolume).sort();
      charts.daily = new Chart(document.getElementById('dailyChart'), {
        type: 'bar',
        data: {
          labels: dailyLabels.map(d => d.slice(5)), // MM-DD
          datasets: [{
            label: 'Inquiries',
            data: dailyLabels.map(d => data.dailyVolume[d]),
            backgroundColor: '#3b82f6',
            borderRadius: 4,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#64748b' }, grid: { display: false } },
            y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' }, beginAtZero: true }
          }
        }
      });

      // Outcome Breakdown
      const outcomes = Object.entries(data.outcomeBreakdown);
      const outcomeColors = {
        quoted: '#60a5fa', order_confirmed: '#4ade80', pricing_pending: '#fbbf24',
        greeting: '#a78bfa', clarification_sent: '#38bdf8', not_found: '#f87171',
        complaint: '#fb923c', error: '#ef4444', follow_up_sent: '#2dd4bf',
        bulk_partial: '#e879f9',
      };
      charts.outcome = new Chart(document.getElementById('outcomeChart'), {
        type: 'doughnut',
        data: {
          labels: outcomes.map(o => o[0]),
          datasets: [{
            data: outcomes.map(o => o[1]),
            backgroundColor: outcomes.map(o => outcomeColors[o[0]] || '#64748b'),
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'right', labels: { color: '#94a3b8', padding: 12 } } }
        }
      });

      // Hourly Distribution
      const hours = Array.from({ length: 24 }, (_, i) => i);
      charts.hourly = new Chart(document.getElementById('hourlyChart'), {
        type: 'line',
        data: {
          labels: hours.map(h => `${h}:00`),
          datasets: [{
            label: 'Inquiries',
            data: hours.map(h => data.hourlyDistribution[h] || 0),
            borderColor: '#a78bfa',
            backgroundColor: 'rgba(167, 139, 250, 0.1)',
            fill: true,
            tension: 0.4,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#64748b', maxTicksLimit: 12 }, grid: { display: false } },
            y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' }, beginAtZero: true }
          }
        }
      });

      // Conversion Funnel
      const funnel = data.conversionFunnel;
      charts.funnel = new Chart(document.getElementById('funnelChart'), {
        type: 'bar',
        data: {
          labels: ['Inquiries', 'Quoted', 'Confirmed', 'Pricing Pending', 'Not Found'],
          datasets: [{
            data: [funnel.inquiries, funnel.quoted, funnel.confirmed, funnel.pricingPending, funnel.notFound],
            backgroundColor: ['#60a5fa', '#3b82f6', '#4ade80', '#fbbf24', '#f87171'],
            borderRadius: 4,
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' }, beginAtZero: true },
            y: { ticks: { color: '#94a3b8' }, grid: { display: false } }
          }
        }
      });
    }

    async function loadData() {
      try {
        // Try fetching from server endpoint first, fall back to inline data
        const res = await fetch('/data.json');
        if (res.ok) {
          const data = await res.json();
          render(data);
          return;
        }
      } catch {}

      // Try loading from local file (for static usage)
      try {
        const res = await fetch('analytics-data.json');
        if (res.ok) {
          const data = await res.json();
          render(data);
          return;
        }
      } catch {}

      document.getElementById('app').innerHTML = '<div class="loading">Failed to load analytics data. Run: node analytics.js --serve</div>';
    }

    loadData();
  </script>
</body>
</html>
