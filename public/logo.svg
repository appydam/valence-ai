<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>

    <radialGradient id="bgRadial" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="coreGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="g1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="g2"/>
      <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
    <filter id="tinyGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#06060C"/>
  <rect width="512" height="512" rx="108" fill="url(#bgRadial)"/>

  <!-- Faint grid -->
  <g opacity="0.025">
    <line x1="60" y1="170" x2="452" y2="170" stroke="#7C4DFF" stroke-width="0.6"/>
    <line x1="60" y1="256" x2="452" y2="256" stroke="#7C4DFF" stroke-width="0.6"/>
    <line x1="60" y1="342" x2="452" y2="342" stroke="#7C4DFF" stroke-width="0.6"/>
    <line x1="170" y1="60" x2="170" y2="452" stroke="#7C4DFF" stroke-width="0.6"/>
    <line x1="256" y1="60" x2="256" y2="452" stroke="#7C4DFF" stroke-width="0.6"/>
    <line x1="342" y1="60" x2="342" y2="452" stroke="#7C4DFF" stroke-width="0.6"/>
  </g>

  <g transform="translate(256, 256)">
    <!-- Ambient glow -->
    <circle cx="0" cy="0" r="70" fill="#7C4DFF" opacity="0.04" filter="url(#softGlow)"/>

    <!-- Three orbital rings -->
    <ellipse cx="0" cy="0" rx="120" ry="46" transform="rotate(-30)"
             fill="none" stroke="url(#ring1)" stroke-width="2.4" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="120" ry="46" transform="rotate(30)"
             fill="none" stroke="url(#ring2)" stroke-width="2.4" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="120" ry="46" transform="rotate(90)"
             fill="none" stroke="url(#ring3)" stroke-width="2.4" opacity="0.85"/>

    <!-- Intersection nodes -->
    <circle cx="0" cy="-82" r="3.5" fill="#00E5FF" filter="url(#tinyGlow)" opacity="0.85"/>
    <circle cx="-71" cy="-41" r="2.8" fill="#7C4DFF" filter="url(#tinyGlow)" opacity="0.6"/>
    <circle cx="71" cy="-41" r="2.8" fill="#7C4DFF" filter="url(#tinyGlow)" opacity="0.6"/>
    <circle cx="0" cy="82" r="3.5" fill="#FF4081" filter="url(#tinyGlow)" opacity="0.85"/>
    <circle cx="-71" cy="41" r="2.8" fill="#FF4081" filter="url(#tinyGlow)" opacity="0.5"/>
    <circle cx="71" cy="41" r="2.8" fill="#00E5FF" filter="url(#tinyGlow)" opacity="0.5"/>

    <!-- Outer axis nodes -->
    <circle cx="-105" cy="0" r="2" fill="#7C4DFF" opacity="0.35"/>
    <circle cx="105" cy="0" r="2" fill="#7C4DFF" opacity="0.35"/>

    <!-- Data traces -->
    <line x1="-120" y1="0" x2="-26" y2="0" stroke="#00E5FF" stroke-width="0.6" opacity="0.12" stroke-dasharray="3,8"/>
    <line x1="120" y1="0" x2="26" y2="0" stroke="#FF4081" stroke-width="0.6" opacity="0.12" stroke-dasharray="3,8"/>
    <line x1="0" y1="-120" x2="0" y2="-18" stroke="#7C4DFF" stroke-width="0.6" opacity="0.12" stroke-dasharray="3,8"/>
    <line x1="0" y1="120" x2="0" y2="18" stroke="#7C4DFF" stroke-width="0.6" opacity="0.12" stroke-dasharray="3,8"/>

    <!-- Core structure -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#coreGrad)" stroke-width="1.2" opacity="0.35"/>
    <circle cx="0" cy="0" r="12" fill="#7C4DFF" opacity="0.1" filter="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="8" fill="url(#coreGrad)" filter="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.95"/>
  </g>
</svg>