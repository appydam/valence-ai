<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="coreGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="g1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="g2"/>
      <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <filter id="tinyGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#06060C"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#7C4DFF" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#7C4DFF" stroke-width="0.5"/>
    <line x1="0" y1="473" x2="1200" y2="473" stroke="#7C4DFF" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#7C4DFF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#7C4DFF" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#7C4DFF" stroke-width="0.5"/>
  </g>

  <!-- Logo mark (orbital rings) — centered at 600, 240 -->
  <g transform="translate(600, 240)">
    <!-- Ambient glow -->
    <circle cx="0" cy="0" r="80" fill="#7C4DFF" opacity="0.05" filter="url(#softGlow)"/>

    <!-- Three orbital rings -->
    <ellipse cx="0" cy="0" rx="110" ry="42" transform="rotate(-30)"
             fill="none" stroke="url(#ring1)" stroke-width="2.2" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="110" ry="42" transform="rotate(30)"
             fill="none" stroke="url(#ring2)" stroke-width="2.2" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="110" ry="42" transform="rotate(90)"
             fill="none" stroke="url(#ring3)" stroke-width="2.2" opacity="0.85"/>

    <!-- Intersection nodes -->
    <circle cx="0" cy="-75" r="3" fill="#00E5FF" filter="url(#tinyGlow)" opacity="0.85"/>
    <circle cx="-65" cy="-37" r="2.4" fill="#7C4DFF" filter="url(#tinyGlow)" opacity="0.6"/>
    <circle cx="65" cy="-37" r="2.4" fill="#7C4DFF" filter="url(#tinyGlow)" opacity="0.6"/>
    <circle cx="0" cy="75" r="3" fill="#FF4081" filter="url(#tinyGlow)" opacity="0.85"/>
    <circle cx="-65" cy="37" r="2.4" fill="#FF4081" opacity="0.5"/>
    <circle cx="65" cy="37" r="2.4" fill="#00E5FF" opacity="0.5"/>

    <!-- Outer axis nodes -->
    <circle cx="-96" cy="0" r="1.8" fill="#7C4DFF" opacity="0.35"/>
    <circle cx="96" cy="0" r="1.8" fill="#7C4DFF" opacity="0.35"/>

    <!-- Data traces -->
    <line x1="-110" y1="0" x2="-24" y2="0" stroke="#00E5FF" stroke-width="0.5" opacity="0.12" stroke-dasharray="3,8"/>
    <line x1="110" y1="0" x2="24" y2="0" stroke="#FF4081" stroke-width="0.5" opacity="0.12" stroke-dasharray="3,8"/>
    <line x1="0" y1="-110" x2="0" y2="-16" stroke="#7C4DFF" stroke-width="0.5" opacity="0.12" stroke-dasharray="3,8"/>
    <line x1="0" y1="110" x2="0" y2="16" stroke="#7C4DFF" stroke-width="0.5" opacity="0.12" stroke-dasharray="3,8"/>

    <!-- Core -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#coreGrad)" stroke-width="1" opacity="0.35"/>
    <circle cx="0" cy="0" r="10" fill="#7C4DFF" opacity="0.1" filter="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="7" fill="url(#coreGrad)" filter="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="2.5" fill="white" opacity="0.95"/>
  </g>

  <!-- Wordmark: "valence" -->
  <text x="600" y="410" text-anchor="middle"
        font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="250" letter-spacing="-1" fill="#E2E8F0">valence</text>

  <!-- "AI" badge -->
  <g transform="translate(752, 378)">
    <rect x="0" y="0" width="44" height="24" rx="5" fill="none" stroke="url(#textAccent)" stroke-width="1.2"/>
    <text x="22" y="17" text-anchor="middle"
          font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="600" letter-spacing="2.5" fill="#7C4DFF">AI</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="460" text-anchor="middle"
        font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400" letter-spacing="0.5" fill="#94A3B8">Autonomous AI Workforce Platform</text>

  <!-- URL at bottom -->
  <text x="600" y="560" text-anchor="middle"
        font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="16" font-weight="400" letter-spacing="1" fill="#64748B">usevalence.ai</text>

  <!-- Gradient accent line under wordmark -->
  <line x1="520" y1="420" x2="680" y2="420" stroke="url(#textAccent)" stroke-width="0.8" opacity="0.3"/>
</svg>
