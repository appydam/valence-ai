<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="r2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="r3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#06060C"/>

  <g transform="translate(16, 16)">
    <!-- Three orbital rings -->
    <ellipse cx="0" cy="0" rx="11" ry="4.2" transform="rotate(-30)"
             fill="none" stroke="url(#r1)" stroke-width="1.2" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="11" ry="4.2" transform="rotate(30)"
             fill="none" stroke="url(#r2)" stroke-width="1.2" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="11" ry="4.2" transform="rotate(90)"
             fill="none" stroke="url(#r3)" stroke-width="1.2" opacity="0.85"/>

    <!-- Key intersection nodes -->
    <circle cx="0" cy="-7.5" r="1" fill="#00E5FF" opacity="0.8"/>
    <circle cx="0" cy="7.5" r="1" fill="#FF4081" opacity="0.8"/>

    <!-- Core -->
    <circle cx="0" cy="0" r="2.2" fill="url(#cg)"/>
    <circle cx="0" cy="0" r="0.9" fill="white" opacity="0.95"/>
  </g>
</svg>